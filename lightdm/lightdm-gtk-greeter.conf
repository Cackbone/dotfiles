# Installed to /etc/lightdm/ by lightdm/install.sh (the greeter can't read $HOME).
[greeter]
background = /usr/share/backgrounds/synthwave/night-city.png
user-background = false
theme-name = Synthwave
icon-theme-name = Papirus-Dark
font-name = JetBrainsMono Nerd Font 11
clock-format = %a %d %b  ·  %H:%M
indicators = ~host;~spacer;~clock;~spacer;~session;~layout;~a11y;~power
position = 50%,center 55%,center
panel-position = top
round-user-image = true
highlight-logged-user = true
screensaver-timeout = 60
default-user-image = /usr/share/backgrounds/synthwave/avatar.svg
