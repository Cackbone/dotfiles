# driftwm tries to take the display the instant the login session exists. Under LightDM that
# is before the greeter's X server has released it, so driftwm gets "Permission denied" on
# /dev/dri and exits (you land back at the login screen). niri waits; driftwm doesn't.
# Wait until logind reports the session active (max 5 s), then give X one more second.
[Service]
ExecStartPre=/bin/sh -c 'for i in $(seq 50); do [ "$(loginctl show-session "$XDG_SESSION_ID" -p Active --value 2>/dev/null)" = yes ] && break; sleep 0.1; done; sleep 1'
