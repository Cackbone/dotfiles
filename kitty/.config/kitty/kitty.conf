# kitty — synthwave
include synthwave.conf

# same shell as xfce4-terminal (the account login shell is still bash)
shell /usr/bin/fish

font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0
# Emoji come from Noto Color Emoji through fontconfig; this pins the main emoji block to it
# (not U+26xx–27xx: symbols like ❯ ➜ ✓ ☀ live there; JetBrains Mono or fallback handle them)
symbol_map U+1F300-U+1FAFF Noto Color Emoji
disable_ligatures cursor

window_padding_width 10 14
# let niri decide the size; otherwise kitty re-requests its last state (e.g. maximized) every launch
remember_window_size no
# starting size where the compositor doesn't tile (driftwm canvas); niri ignores it
initial_window_width  1100
initial_window_height 700
hide_window_decorations yes
confirm_os_window_close 0
enable_audio_bell no
cursor_shape block
cursor_blink_interval 0.6
scrollback_lines 10000
copy_on_select clipboard
url_style curly

tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted
tab_title_template "{index}: {title}"

# --- cursor trail: the text cursor glides (with a magenta trail) when it jumps,
#     including between split panes of the same kitty window
cursor_trail 3
cursor_trail_decay 0.08 0.35
cursor_trail_start_threshold 2
cursor_trail_color #e040fb

# --- splits inside one kitty window (the trail follows focus between panes)
enabled_layouts splits,stack
window_border_width 2pt
draw_minimal_borders yes
window_margin_width 0
inactive_text_alpha 0.75
map ctrl+shift+enter launch --location=hsplit --cwd=current
map ctrl+shift+backslash launch --location=vsplit --cwd=current
map ctrl+shift+left  neighboring_window left
map ctrl+shift+right neighboring_window right
map ctrl+shift+up    neighboring_window up
map ctrl+shift+down  neighboring_window down
map ctrl+shift+alt+left  move_window left
map ctrl+shift+alt+right move_window right
map ctrl+shift+alt+up    move_window up
map ctrl+shift+alt+down  move_window down
map ctrl+shift+z toggle_layout stack

# --- mouse: right-click copies the selection (like xfce4-terminal's Copy), middle-click pastes
mouse_map right press ungrabbed copy_to_clipboard
mouse_map middle release ungrabbed paste_from_clipboard
