# Sound here is PulseAudio's job (pulseaudio, not pipewire-pulse): WirePlumber only links
# video streams — screen recording / sharing through the portal (Kooha, OBS, browsers) and
# webcams. Keep it off the sound cards and Bluetooth, which PulseAudio owns (Bluetooth
# headphones would otherwise end up on PipeWire, silent for PulseAudio apps).
# Same as WirePlumber's own "video-only" profile, applied to the default one.
wireplumber.profiles = {
  main = {
    hardware.audio = disabled
    hardware.bluetooth = disabled
  }
}
