# Read by Arch's chromium launcher at every start (also for chromium-gpu).
# Video decoded (and encoded, for calls) by the Intel GPU: VA-API, needs intel-media-driver.
# Check chrome://gpu ("Video Decode: Hardware accelerated") and, while a video plays,
# chrome://media-internals (kVideoDecoderName: VaapiVideoDecoder).
--enable-features=AcceleratedVideoDecoder,AcceleratedVideoEncoder
# The GPU (Comet Lake) can't decode AV1, which YouTube prefers whenever the browser offers
# it: without the software AV1 decoder, YouTube sends VP9, which the GPU decodes.
--disable-features=Dav1dVideoDecoder
